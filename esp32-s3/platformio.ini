; Seeed Studio XIAO ESP32S3 Sense
; The Sense expansion (camera + mic) shares the plain XIAO ESP32S3 board
; definition -- only the add-on differs, so the same board id applies.
;
; One source file per environment:
;   robot (default) -- joystick-driven walking policy  -> src/policy_robot.cpp
;   diag            -- LSM6DS3 read + servo-bus probe   -> src/diag.cpp
;   spin             -- sweep one servo back and forth  -> src/servo_spin.cpp
;   blink            -- LED blink sanity check          -> src/blink.cpp
;   pad              -- Xbox BLE controller test         -> src/xbox_pad.cpp
; Flash a specific one with:  pio run -e blink -t upload

[platformio]
default_envs = robot

[env]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

; The S3 talks over its built-in USB peripheral (VID:PID 303a:1001), not a
; separate UART bridge. These two flags route Serial to that native USB port,
; otherwise the monitor stays silent.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 115200
; Auto-detect USB; use --upload-port /dev/ttyACM1 if multiple boards are attached.

[env:diag]
build_src_filter = +<diag.cpp>

[env:blink]
build_src_filter = +<blink.cpp>

[env:spin]
build_src_filter = +<servo_spin.cpp>

[env:bench]
build_src_filter = +<policy_bench.cpp>
; Same optimisation flags as env:robot, so the scalar row is the in-loop kernel.
build_unflags = -Os
build_flags   = ${env.build_flags} -O3

[env:pad]
build_src_filter = +<xbox_pad.cpp>
lib_deps = asukiaaa/XboxSeriesXControllerESP32_asukiaaa@^1.1.2

[env:blescan]
build_src_filter = +<ble_scan.cpp>
lib_deps = h2zero/NimBLE-Arduino@^2.5.1

[env:padservo]
build_src_filter = +<pad_servo.cpp>
lib_deps = asukiaaa/XboxSeriesXControllerESP32_asukiaaa@^1.1.2

[env:policy]
build_src_filter = +<policy_run.cpp>
build_unflags = -Os
build_flags   = ${env.build_flags} -O3

[env:hil]
build_src_filter = +<policy_hil.cpp>
build_unflags = -Os
build_flags   = ${env.build_flags} -O3

[env:robot]
board_build.partitions = partitions_robot.csv
build_src_filter = +<policy_robot.cpp>
lib_deps = asukiaaa/XboxSeriesXControllerESP32_asukiaaa@^1.1.2
build_unflags = -Os
build_flags   = ${env.build_flags} -O3

; Same robot firmware at 25 Hz: the 50 Hz-trained policy run at half rate.
[env:robot25]
extends = env:robot
build_flags = ${env:robot.build_flags} -DK2_CONTROL_HZ=25

; 10 Hz: where the twin sweep shows standing limit cycles and falls begin.
[env:robot10]
extends = env:robot
build_flags = ${env:robot.build_flags} -DK2_CONTROL_HZ=10

; ONE binary for 50/25/10 Hz: rate chosen over serial before arming (5/2/1),
; saved in NVS. Removes build/layout differences from rate comparisons.
[env:robot_rates]
extends = env:robot
build_flags = ${env:robot.build_flags} -DK2_RUNTIME_RATE=1

; Deployed policy with the faster inference path (see env:bench for the numbers):
; ESP-DSP dot products, and weights that miss the SRAM cache go to PSRAM.
[env:robot_fast]
extends = env:robot
build_flags = ${env:robot.build_flags} -DK2_INFER_DSP=1 -DK2_WEIGHTS_PSRAM=1

[env:robot_diag]
extends = env:robot
build_flags = ${env:robot.build_flags} -DK2_DIAGNOSTIC_ONLY=1
